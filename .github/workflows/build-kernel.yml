name: JackA1ltman - toraidl - SM8250 - ColorOS 16/17

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Oneplus 8 Series - ${{ matrix.branch }}
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: ubuntu:bionic # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    strategy:
      matrix:
        include:
          - branch: "android17"
            device: "op8series-coloros17"
            ksu: true
          - branch: "android16"
            device: "op8series-coloros16"
            ksu: true
      fail-fast: true
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Git Kernel Source
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://x-access-token:${TOKEN}@github.com/JackA1ltman/coloros16_sm8250_kernel.git -b "${{ matrix.branch }}"  coloros_sm8250_kernel --depth 1

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          preinstalled-runtimes: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Remove useless tools
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install necessary packages
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

          sudo apt update
          sudo apt install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng  maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio coccinelle libbpf-dev -y
          sudo apt-get install zstd libc6 binutils libc6-dev-i386 gcc g++ p7zip p7zip-full -y

          # Install Pahole
          sudo apt build-dep pahole
          sudo apt install cmake libbpf-dev libdw-dev

          git clone https://github.com/acmel/dwarves.git  --depth 1
          cd dwarves
          mkdir build && cd build

          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

          pahole --version

          cd ../../

          # Install Libtinfo5
          curl -C - --progress-bar -L http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb -o libtinfo5.deb
          sudo apt install ./libtinfo5.deb
          rm -f libtinfo5.deb

          sudo apt install python3 -y
          sudo rm -rf /usr/bin/python
          sudo ln -s /usr/bin/python3 /usr/bin/python

      - name: Get build tools
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel

          bash build_kernel.sh -g

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: build-kernel
          max-size: 2G

      - name: Get Kernel
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel

          if [[ "${{ matrix.ksu }}" == "true" ]]; then
            echo "KSU_NAME=-ksu" >> $GITHUB_ENV

            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo "CONFIG_KSU=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh" | bash -s
          else
            echo "KSU_NAME=" >> $GITHUB_ENV
          fi

      - name: Get Packing Tools
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel
          git clone "https://github.com/osm0sis/AnyKernel3.git" -b "master" Anykernel3
          cd Anykernel3
          git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68
          cd ../

      - name: Add ReKernel
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" | bash -s

          wget https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true

          echo "CONFIG_REKERNEL=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel

           bash build_kernel.sh -b

      - name: Make Anykernel3 - Perfix
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel

          sed -i 's/Anykernel3 by osm0sis @ xda-developers/ColorOS NonGKI Kernel Build by JackAltman @ Github/g' Anykernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh

      - name: Make Anykernel3 Flasher - DTB
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel
          mkdir -p tmp

          cp -fp GITHUB_WORKSPACE/coloros_sm8250_kernel/out/arch/arm64/boot/Image tmp
          cp -fp GITHUB_WORKSPACE/coloros_sm8250_kernel/out/arch/arm64/boot/dtb tmp
          cp -fp GITHUB_WORKSPACE/coloros_sm8250_kernel/out/arch/arm64/boot/dtbo.img tmp

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ matrix.device }}-$TIME${{ env.KSU_NAME }}-DTB.zip
          rm -rf tmp

          echo "PACK_NAME_DTB=${{ matrix.device }}-$TIME${{ env.KSU_NAME }}-DTB.zip" >> $GITHUB_ENV

      - name: Upload Build Artifacts For Anykernel3 to Openlist
        run: |
          cd $GITHUB_WORKSPACE/coloros_sm8250_kernel
          curl -T "$GITHUB_WORKSPACE/${{ env.PACK_NAME_DTB }}" -u "${{ secrets.OPENLIST_ACCOUNT }}" "${{ secrets.OPENLIST_LINK }}/${{ env.PACK_NAME_DTB }}"

      - name: Upload Build Artifacts For Anykernel3
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ env.PACK_NAME_DTB }}
          path: |
            ${{ env.PACK_NAME_DTB }}
